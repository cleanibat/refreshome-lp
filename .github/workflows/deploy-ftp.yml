name: Déploiement FTP/FTPS

# Hébergeur sans SSH (mutualisé OVH, Ionos, LWS, Hostinger sans clé…).
# Secrets : FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR (finit par /), SITE_URL. Protocole ftps par défaut, passer à ftp si l'hébergeur ne supporte pas TLS.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Envoyer les fichiers par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_SERVER_DIR }}   # ex. /artipierre.fr/ (se termine par /)
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            build.py
            README.md
            .nojekyll
            .DS_Store
      - name: Vérifier la mise en ligne
        run: |
          sleep 5
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "${{ secrets.SITE_URL }}" || true
